<!doctype html>
<html lang="en" class="dark">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <title>You're offline — SixVox</title>
    <meta name="theme-color" content="#0C1017" />
    <link rel="icon" type="image/png" sizes="32x32" href="/favicon-32x32.png" />
    <link rel="apple-touch-icon" sizes="180x180" href="/apple-touch-icon.png" />
    <style>
      :root {
        color-scheme: dark;
      }
      body {
        margin: 0;
        min-height: 100dvh;
        display: grid;
        place-items: center;
        background: #0c1017;
        color: #e6ecf5;
        padding: 24px;
        font-family:
          "Figtree",
          ui-sans-serif,
          system-ui,
          -apple-system,
          sans-serif;
      }
      @media (orientation: landscape) {
        body {
          background-image: url("/splash-landscape.png");
        }
      }
      main {
        max-width: 24rem;
        text-align: center;
      }
      .badge {
        width: 96px;
        height: 96px;
        margin: 0 auto 22px;
        border-radius: 26px;
        display: block;
        object-fit: contain;
      }
      h1 {
        font-size: 1.35rem;
        margin: 0 0 8px;
        letter-spacing: 0;
      }
      p {
        margin: 0 0 24px;
        font-size: 0.9rem;
        line-height: 1.55;
        color: rgba(245, 245, 244, 0.68);
      }
      button {
        min-height: 48px;
        padding: 0 26px;
        border: 0;
        border-radius: 999px;
        cursor: pointer;
        font: inherit;
        font-weight: 600;
        color: #fff;
        background: #3b82f6;
      }
    </style>
  </head>
  <body>
    <main>
      <img class="badge" src="/icon-192.png" alt="SixVox" width="96" height="96" />
      <h1>You're offline</h1>
      <p>
        SixVox can't reach the network right now. Calls, messages and your inbox will sync as soon
        as you're back online.
      </p>
      <button type="button" onclick="window.location.reload()">Try again</button>
    </main>
  </body>
</html>
