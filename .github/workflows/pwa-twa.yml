name: PWA / TWA artifacts

# Play uploads run on a version tag (twa-v* or v*) or a manual dispatch.
# A tag that does not touch the path filters below will not start this
# workflow; use workflow_dispatch for those releases. Pushes to main never
# upload to Google Play.
on:
  push:
    branches: [main]
    tags: ['twa-v*', 'v*']
    paths:
      - 'public/manifest.webmanifest'
      - 'twa-manifest.json'
      - 'scripts/sync-twa-manifest.mjs'
      - '.github/workflows/pwa-twa.yml'
  pull_request:
    paths:
      - 'public/manifest.webmanifest'
      - 'twa-manifest.json'
  workflow_dispatch:
    inputs:
      release:
        description: 'Create a GitHub Release with the AAB'
        type: boolean
        default: false
      play_track:
        description: 'Google Play track to upload to'
        type: choice
        default: internal
        options: [none, internal, alpha, beta, production]
      play_status:
        description: 'Release status on that track'
        type: choice
        default: draft
        options: [draft, inProgress, halted, completed]

concurrency:
  group: pwa-twa-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - name: Install dependencies
        run: npm ci

      - name: Sync TWA manifest from web manifest
        run: node scripts/sync-twa-manifest.mjs

      - name: Commit manifest sync
        if: github.event_name == 'push'
        run: |
          if [ -n "$(git status --porcelain twa-manifest.json)" ]; then
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git commit -m "chore(twa): sync twa-manifest.json [skip ci]" twa-manifest.json
            git push
          fi

      - name: Build PWA (service worker + manifest)
        run: npm run build

      - name: Build Android App Bundle (TWA)
        env:
          KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          npm install -g @bubblewrap/cli
          if [ -n "$KEYSTORE_BASE64" ]; then
            echo "$KEYSTORE_BASE64" | base64 -d > android.keystore
            bubblewrap updateConfig --jdkPath "$JAVA_HOME" || true
            bubblewrap build --manifest=twa-manifest.json --skipPwaValidation \
              --signingKeyPath=android.keystore \
              --signingKeyAlias="$KEY_ALIAS" <<EOF
          $KEYSTORE_PASSWORD
          $KEY_PASSWORD
          EOF
          else
            echo "No signing keystore configured — building unsigned bundle."
            bubblewrap build --manifest=twa-manifest.json --skipPwaValidation --skipSigning || true
          fi
          rm -f android.keystore

      - name: Read app version
        id: ver
        run: |
          VC=$(node -p "require('./twa-manifest.json').appVersionCode || 1")
          VN=$(node -p "require('./twa-manifest.json').appVersionName || '1.0.0'")
          echo "code=$VC" >> "$GITHUB_OUTPUT"
          echo "name=$VN" >> "$GITHUB_OUTPUT"
          ls -la *.aab *.apk 2>/dev/null || true

      - name: Generate versioned CHANGELOG.md
        id: changelog
        run: |
          VERSION="v${{ steps.ver.outputs.name }}-${{ steps.ver.outputs.code }}"
          PREV_TAG=$(git tag --list 'twa-v*' --sort=-creatordate | head -n 1)
          if [ -n "$PREV_TAG" ]; then
            RANGE="$PREV_TAG..HEAD"
          else
            RANGE=""
          fi
          {
            echo "# SixVox TWA $VERSION"
            echo ""
            echo "- Version name: ${{ steps.ver.outputs.name }}"
            echo "- Version code: ${{ steps.ver.outputs.code }}"
            echo "- Commit: ${{ github.sha }}"
            echo "- Built: $(date -u '+%Y-%m-%d %H:%M UTC')"
            echo ""
            echo "## Changes"
            echo ""
            git log --no-merges --pretty='- %s (%h)' $RANGE | head -n 200
          } > CHANGELOG.md
          cat CHANGELOG.md

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: sixvox-twa-v${{ steps.ver.outputs.name }}-${{ steps.ver.outputs.code }}
          if-no-files-found: warn
          retention-days: 30
          path: |
            app-release-bundle.aab
            app-release-signed.apk
            twa-manifest.json
            CHANGELOG.md

      - name: Create GitHub Release
        if: hashFiles('app-release-bundle.aab') != '' && github.event_name != 'pull_request'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: twa-v${{ steps.ver.outputs.name }}-${{ steps.ver.outputs.code }}
          name: SixVox TWA v${{ steps.ver.outputs.name }} (${{ steps.ver.outputs.code }})
          body_path: CHANGELOG.md
          files: |
            app-release-bundle.aab
            app-release-signed.apk
            CHANGELOG.md
          fail_on_unmatched_files: false

      - name: Resolve Play track
        id: play
        env:
          SA_JSON: ${{ secrets.PLAY_SERVICE_ACCOUNT_JSON }}
        run: |
          TRACK="${{ inputs.play_track }}"
          if [ -z "$TRACK" ]; then TRACK="internal"; fi
          STATUS="${{ inputs.play_status }}"
          if [ -z "$STATUS" ]; then STATUS="draft"; fi
          REF="${{ github.ref }}"
          EVENT="${{ github.event_name }}"
          ENABLED=false
          if [ "$EVENT" = "workflow_dispatch" ]; then ENABLED=true; fi
          if [ "$EVENT" = "push" ] && [ "${REF#refs/tags/}" != "$REF" ]; then ENABLED=true; fi
          [ "$TRACK" = "none" ] && ENABLED=false
          [ -z "$SA_JSON" ] && ENABLED=false
          [ ! -f app-release-bundle.aab ] && ENABLED=false
          echo "track=$TRACK" >> "$GITHUB_OUTPUT"
          echo "status=$STATUS" >> "$GITHUB_OUTPUT"
          echo "enabled=$ENABLED" >> "$GITHUB_OUTPUT"
          if [ "$ENABLED" != "true" ]; then
            echo "Skipping Play upload (track=$TRACK, aab present=$( [ -f app-release-bundle.aab ] && echo yes || echo no ), service account=$( [ -n "$SA_JSON" ] && echo yes || echo no ))" >> "$GITHUB_STEP_SUMMARY"
          fi

      - name: Upload AAB to Google Play
        if: steps.play.outputs.enabled == 'true'
        id: playupload
        uses: r0adkll/upload-google-play@v1
        with:
          serviceAccountJsonPlainText: ${{ secrets.PLAY_SERVICE_ACCOUNT_JSON }}
          packageName: app.sixvox
          releaseFiles: app-release-bundle.aab
          track: ${{ steps.play.outputs.track }}
          status: ${{ steps.play.outputs.status }}
          releaseName: ${{ steps.ver.outputs.name }} (${{ steps.ver.outputs.code }})
          changesNotSentForReview: false

      - name: Report Play release status
        if: always() && steps.play.outputs.enabled == 'true'
        run: |
          {
            echo "### Google Play upload"
            echo ""
            echo "- Package: \`app.sixvox\`"
            echo "- Version: ${{ steps.ver.outputs.name }} (${{ steps.ver.outputs.code }})"
            echo "- Track: ${{ steps.play.outputs.track }}"
            echo "- Status: ${{ steps.play.outputs.status }}"
            echo "- Result: ${{ steps.playupload.outcome }}"
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Attach release notes to Play track
        if: steps.play.outputs.enabled == 'true' && steps.playupload.outcome == 'success'
        run: echo "Play release ${{ steps.ver.outputs.name }} (${{ steps.ver.outputs.code }}) sent to ${{ steps.play.outputs.track }} with status ${{ steps.play.outputs.status }}." >> "$GITHUB_STEP_SUMMARY"
